# managed by syravec setup-domain-https.sh
server {
    listen 80;
    listen [::]:80;
    server_name syravec.fanat-sira.art;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/syravec-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "syravec: HTTPS setup is in progress\n";
    }
}
