# managed by syravec setup-domain-https.sh
server {
    listen 80;
    listen [::]:80;
    server_name syravec.fanat-sira.art;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/syravec-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://syravec.fanat-sira.art$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name syravec.fanat-sira.art;

    ssl_certificate /etc/letsencrypt/live/syravec.fanat-sira.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syravec.fanat-sira.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SYRAVEC_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;
    access_log /var/log/nginx/syravec.access.log;
    error_log /var/log/nginx/syravec.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 70s;
        proxy_send_timeout 60s;
    }
}
