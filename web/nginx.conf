server {
 listen 80;
 server_name _;
 # Trust the host nginx through the Docker bridge; take its last XFF address.
 set_real_ip_from 172.16.0.0/12;
 set_real_ip_from 127.0.0.1;
 set_real_ip_from ::1;
 real_ip_header X-Forwarded-For;
 real_ip_recursive off;
 root /usr/share/nginx/html;
 client_max_body_size 2m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
 location /api/ {
  proxy_pass http://api:8080;
  proxy_read_timeout 65s;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
 }
 location /assets/ { try_files $uri =404; }
 location /static/ { try_files $uri =404; }
 location = /index.html { expires -1; }
 location / { try_files $uri $uri/ /index.html; }
}
