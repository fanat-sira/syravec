server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 2m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
 location /api/ {
  proxy_pass http://api:8080;
  proxy_read_timeout 55s;
  proxy_set_header Host $host;
 }
 location /assets/ { try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
}
