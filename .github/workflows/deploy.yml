name: deploy
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published commit SHA (also used for rollback)'
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    environment: production
    timeout-minutes: 15
    env:
      DEPLOY_DIR: /opt/syravec
      COMPOSE_PROJECT_NAME: syravec
      SYRAVEC_IMAGE: ghcr.io/${{ github.repository }}
      SYRAVEC_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check runner and persistent application directory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SYRAVEC_TAG" =~ ^[a-f0-9]{40}$ ]] || { echo 'use a full published commit SHA'; exit 1; }
          echo "deployment user: $(id -un)"
          printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/syravec-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          docker info > /dev/null
          docker compose version
          test -d "$DEPLOY_DIR" && test -w "$DEPLOY_DIR" || { echo 'create /opt/syravec and grant the runner user write access (see README)'; exit 1; }
          test -r "$DEPLOY_DIR/.env" || { echo 'create /opt/syravec/.env (may be empty without AI)'; exit 1; }
          test -r "$DEPLOY_DIR/originals/assets.zip" || { echo 'provide /opt/syravec/originals/assets.zip'; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install deployment files and start published release
        shell: bash
        run: |
          set -euo pipefail
          install -m 644 compose.yaml compose.release.yaml .env.example "$DEPLOY_DIR/"
          mkdir -p "$DEPLOY_DIR/scripts"
          install -m 755 scripts/deploy.sh "$DEPLOY_DIR/scripts/deploy.sh"
          install -m 755 scripts/setup-domain-https.sh "$DEPLOY_DIR/scripts/setup-domain-https.sh"
          mkdir -p "$DEPLOY_DIR/deploy/nginx"
          install -m 644 deploy/nginx/syravec.http.conf deploy/nginx/syravec.https.conf "$DEPLOY_DIR/deploy/nginx/"
          install -m 755 deploy/nginx/syravec-renew-hook.sh "$DEPLOY_DIR/deploy/nginx/"
          cd "$DEPLOY_DIR"
          sh scripts/deploy.sh
      - name: Show application status
        if: success()
        working-directory: /opt/syravec
        run: docker compose -f compose.yaml -f compose.release.yaml ps -a
